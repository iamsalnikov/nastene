services:
  postgres:
    image: postgres:16-alpine
    container_name: nastene-postgres
    environment:
      POSTGRES_USER: nastene
      POSTGRES_PASSWORD: nastene
      POSTGRES_DB: nastene
    ports:
      - "5432:5432"
    volumes:
      - nastene-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nastene -d nastene"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nastene-pg:
