{{ define "content" }}
<div class="box">
    <h1>Регистрация</h1>
    <form method="post" action="/register" class="form">
        <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">
        <div class="row">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ if .Data }}{{ index .Data "Email" }}{{ end }}" required>
        </div>
        <div class="row">
            <label for="display_name">Имя на стене</label>
            <input type="text" id="display_name" name="display_name" value="{{ if .Data }}{{ index .Data "DisplayName" }}{{ end }}" required>
        </div>
        <div class="row">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
            <div class="hint">Минимум 6 символов.</div>
        </div>
        <div class="row">
            <button type="submit">Зарегистрироваться</button>
        </div>
    </form>
    <p class="hint">Уже с нами? <a href="/login">Войти</a>.</p>
</div>
{{ end }}
